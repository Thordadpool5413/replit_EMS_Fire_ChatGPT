name: Missing provider county research
on:
  push:
    branches: [atlas/phase9-0j-county-recovery]
  pull_request:
    paths:
      - 'scripts/data/research_missing_counties.py'
      - 'scripts/data/test_missing_counties.py'
      - '.github/workflows/missing-county-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/data -p test_missing_counties.py
      - run: python3 scripts/data/research_missing_counties.py --output generated-artifacts/county-recovery
      - uses: actions/upload-artifact@v4
        with:
          name: county-recovery-research
          path: generated-artifacts/county-recovery/
          if-no-files-found: error
