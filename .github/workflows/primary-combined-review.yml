name: Verify primary coverage without publishing provider records
on:
  push:
    branches: [atlas/reach-95-primary-mapping]
permissions:
  contents: read
jobs:
  combined:
    if: contains(github.event.head_commit.message, '[review-primary-local]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PRIMARY_REVIEW_ROOT: generated-artifacts/primary-local-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned native shapefile reader
        run: python3 -m pip install --disable-pip-version-check pyshp==2.3.1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read already-retained range evidence into this runner only
        run: |
          set -euo pipefail
          git fetch --no-tags origin 5bc2a60d6f397f41b7cc17a0907e38a5018f79f6
          git restore --worktree --source=5bc2a60d6f397f41b7cc17a0907e38a5018f79f6 -- \
            scripts/data/evidence/primary-neris-range-sites \
            scripts/data/evidence/primary-neris-mailing-range-sites \
            artifacts/ems-territory-intelligence/src/services/nerisRangeSitePins.json \
            artifacts/ems-territory-intelligence/src/services/nerisMailingRangeSitePins.json \
            scripts/fixtures/neris-retained-range-examples.json \
            scripts/fixtures/neris-retained-mailing-range-examples.json
      - name: Verify source selection and preserved identity safeguards
        run: python3 -m unittest discover -s scripts/data -p test_primary_mapping_release.py
      - name: Verify the aggregate output boundary
        run: python3 scripts/data/run_nppes_phone_local_review.py --self-test
      - name: Replay all non-phone sources in private runner files
        run: |
          set -euo pipefail
          mkdir -p "$PRIMARY_REVIEW_ROOT"
          if ! python3 -u scripts/data/run_combined_primary_review.py \
            --output "$PRIMARY_REVIEW_ROOT/nonphone" \
            > "$PRIMARY_REVIEW_ROOT/nonphone.log" 2>&1; then
            echo "Complete non-phone verification failed; raw records and logs remain runner-local."
            exit 1
          fi
      - name: Verify final phone proofs, actual app coverage, and exact 95 percent target
        run: |
          python3 -u scripts/data/run_nppes_phone_local_review.py \
            --nonphone "$PRIMARY_REVIEW_ROOT/nonphone" \
            --output "$PRIMARY_REVIEW_ROOT/final-review" \
            --aggregate-output "$PRIMARY_REVIEW_ROOT/aggregate.json" \
            --require-target
      # No contents:write, commits, pushes, uploads, retained record artifacts,
      # geocoder requests, or deployment are part of this workflow.
