name: Rebuild retained NERIS profiles
on:
  push:
    branches: [atlas/recover-neris-profiles]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mailing-source:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rebuild-neris-source]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check reconstructed source and exact first target batch
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/data/stage_neris_mailing_supplement.py scripts/data/retain_neris_mailing_source.py scripts/data/prepare_neris_independent_sites.py
          python3 scripts/data/retain_neris_primary.py --verify
          python3 scripts/data/prepare_neris_independent_sites.py --batch original-1251 --output "$RUNNER_TEMP/neris-original-1251.json" --report "$RUNNER_TEMP/neris-original-1251-report.json"
      - name: Acquire complete fixed public fields and bind original native records
        run: |
          set -euo pipefail
          python3 -u scripts/data/stage_neris_mailing_supplement.py --directory "$RUNNER_TEMP/neris-mailing-source"
          python3 scripts/data/retain_neris_mailing_source.py --directory "$RUNNER_TEMP/neris-mailing-source" --pin-edition
          python3 scripts/data/retain_neris_mailing_source.py --verify
      - name: Preserve frozen original target bytes
        run: |
          set -euo pipefail
          mkdir -p scripts/data/evidence/primary-neris-original-site-targets/2026-11-26
          cp "$RUNNER_TEMP/neris-original-1251.json" scripts/data/evidence/primary-neris-original-site-targets/2026-11-26/targets.json
          cp "$RUNNER_TEMP/neris-original-1251-report.json" scripts/data/evidence/primary-neris-original-site-targets/2026-11-26/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neris-native-source-review
          path: |
            scripts/data/evidence/neris-department-mailing
            scripts/data/evidence/primary-neris-original-site-targets
            scripts/fixtures/neris-mailing-source-edition.json
            ${{ runner.temp }}/neris-mailing-source/metadata-before.json
      - name: Save reviewed source evidence on an isolated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "atlas/neris-native-source-$GITHUB_RUN_ID"
          git add --force scripts/data/evidence/neris-department-mailing scripts/data/evidence/primary-neris-original-site-targets scripts/fixtures/neris-mailing-source-edition.json
          git diff --cached --quiet && exit 0
          git commit -m "Retain complete native NERIS supplemental source and frozen original site targets"
          git push origin HEAD
  mailing-identities:
    if: contains(github.event.head_commit.message, '[rebuild-neris-mailing]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce complete mailing identities and physical site targets
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/data/recover_neris_mailing_sites.py scripts/data/retain_neris_mailing_sites.py scripts/data/neris_profile_witnesses.py
          python3 scripts/data/retain_neris_mailing_source.py --verify
          python3 -u scripts/data/recover_neris_mailing_sites.py --output "$RUNNER_TEMP/neris-mailing-report.json" --targets "$RUNNER_TEMP/neris-mailing-targets.json"
          python3 -u scripts/data/retain_neris_mailing_sites.py --report "$RUNNER_TEMP/neris-mailing-report.json" --targets "$RUNNER_TEMP/neris-mailing-targets.json" --pin-targets
          python3 -u scripts/data/retain_neris_mailing_sites.py --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neris-mailing-identity-review
          path: |
            scripts/data/evidence/primary-neris-mailing-sites
            scripts/fixtures/neris-mailing-target-edition.json
            ${{ runner.temp }}/neris-mailing-report.json
            ${{ runner.temp }}/neris-mailing-targets.json
      - name: Save source bound identity scope on isolated review branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "atlas/neris-mailing-identities-$GITHUB_RUN_ID"
          git add --force scripts/data/evidence/primary-neris-mailing-sites scripts/fixtures/neris-mailing-target-edition.json
          git diff --cached --quiet && exit 0
          git commit -m "Retain replayed NERIS mailing identities and actual frozen physical site targets"
          git push origin HEAD
  owned-tests:
    if: contains(github.event.head_commit.message, '[test-neris-profiles]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate native identity, component and complete endpoint guards
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/data python3 -m unittest scripts/data/test_neris_primary_rebuilt.py scripts/data/test_neris_mailing_sites.py scripts/data/test_neris_geocoded_sites.py
  grid-points:
    if: contains(github.event.head_commit.message, '[rebuild-neris-grid]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test and replay complete native directional grid points
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/data python3 -m unittest scripts/data/test_neris_grid_points.py
          python3 -u scripts/data/retain_neris_grid_points.py
          python3 -u scripts/data/retain_neris_grid_points.py --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neris-grid-point-review
          path: scripts/data/evidence/primary-neris-grid-points
      - name: Save complete native grid point replay on isolated review branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "atlas/neris-grid-points-$GITHUB_RUN_ID"
          git add --force scripts/data/evidence/primary-neris-grid-points
          git diff --cached --quiet && exit 0
          git commit -m "Retain exact native directional grid address source points"
          git push origin HEAD
  usfa-native-source:
    if: contains(github.event.head_commit.message, '[rebuild-usfa-native]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Retain complete fixed national CSV and native identity reconciliation
        run: |
          set -euo pipefail
          python3 -u scripts/data/retain_usfa_native_source.py --download --pin-edition --directory "$RUNNER_TEMP/usfa-native"
          python3 -u scripts/data/retain_usfa_native_source.py --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usfa-native-source-review
          path: |
            scripts/data/evidence/usfa-native-national
            scripts/fixtures/usfa-native-source-edition.json
            ${{ runner.temp }}/usfa-native
      - name: Save complete native public source on isolated review branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "atlas/usfa-native-source-$GITHUB_RUN_ID"
          git add --force scripts/data/evidence/usfa-native-national scripts/fixtures/usfa-native-source-edition.json
          git diff --cached --quiet && exit 0
          git commit -m "Retain complete fixed public USFA native source and malformed row quarantine"
          git push origin HEAD
  retained-frontend-pins:
    if: contains(github.event.head_commit.message, '[rebuild-neris-pins]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build exact frontend and API bindings from full native replay
        run: |
          set -euo pipefail
          python3 -u scripts/data/build_neris_retained_profile_pins.py --profile mailing --profile grid --validation-output "$RUNNER_TEMP/neris-profile-frontend.json"
          npx --yes tsx --test artifacts/ems-territory-intelligence/src/services/nerisProofHash.test.ts
          npx --yes tsx scripts/data/check_neris_retained_frontend.ts "$RUNNER_TEMP/neris-profile-frontend.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neris-retained-frontend-bindings
          path: |
            artifacts/ems-territory-intelligence/src/services/neris*Pins.json
            artifacts/api-server/src/lib/nerisGrid*
            scripts/fixtures/neris-retained-*-examples.json
      - name: Save exact frontend proof bindings on isolated review branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "atlas/neris-retained-pins-$GITHUB_RUN_ID"
          git add artifacts/ems-territory-intelligence/src/services/neris*Pins.json artifacts/api-server/src/lib/nerisProofHash.ts artifacts/api-server/src/lib/nerisGridAddressContract.ts artifacts/api-server/src/lib/nerisGridPointPins.json scripts/fixtures/neris-retained-*-examples.json
          git diff --cached --quiet && exit 0
          git commit -m "Bind native NERIS mailing and grid frontend records to exact replayed evidence"
          git push origin HEAD
