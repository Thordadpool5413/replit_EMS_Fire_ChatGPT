openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: territory
    description: Public-data lookups for EMS and fire territories
  - name: research
    description: Gemini-backed territory research
  - name: workspace-records
    description: Shared agency and workspace records stored by the Replit backend
  - name: reviewed-evidence
    description: Role-gated, public-source evidence stored by the Replit backend
  - name: Auth
    description: Browser and mobile Replit authentication endpoints
paths:
  /:
    get:
      operationId: apiRoot
      tags: [health]
      summary: API root health check
      description: Returns server health status at the API base path
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /agencies:
    get:
      operationId: listAgencyRecords
      tags: [workspace-records]
      summary: Read a stable page of agency records
      description: Returns Replit-stored agency records in ID order. Requests are bounded and can be filtered to a state.
      parameters:
        - in: query
          name: stateCode
          schema:
            type: string
            pattern: "^[A-Za-z]{2}$"
        - in: query
          name: after
          schema:
            type: string
            maxLength: 300
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: One bounded page of shared agency records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencyRecordPage"
        "503":
          description: Replit database is unavailable
  /agencies/{agencyId}:
    get:
      operationId: getAgencyRecord
      tags: [workspace-records]
      summary: Read one agency record
      parameters:
        - in: path
          name: agencyId
          required: true
          schema:
            type: string
            maxLength: 300
      responses:
        "200":
          description: Agency record and revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencyRecord"
        "404":
          description: Agency record not found
    put:
      operationId: updateAgencyRecord
      tags: [workspace-records]
      summary: Save an agency record with revision protection
      parameters:
        - in: path
          name: agencyId
          required: true
          schema:
            type: string
            maxLength: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencyRecordUpdate"
      responses:
        "200":
          description: Updated record and new revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencyRecord"
        "409":
          description: The record changed since the supplied revision
  /agencies/{agencyId}/mutations:
    post:
      operationId: commitAgencyMutation
      tags: [workspace-records]
      summary: Apply an idempotent offline mutation
      description: A repeated mutation ID returns its original receipt revision and the current agency payload with its own _revision; stale new mutations are rejected without overwriting newer data.
      parameters:
        - in: path
          name: agencyId
          required: true
          schema:
            type: string
            maxLength: 300
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencyMutationInput"
      responses:
        "200":
          description: Mutation receipt and committed agency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencyMutationResponse"
        "409":
          description: The record changed since the queued mutation was created
  /agencies/batch-create:
    post:
      operationId: createAgencyRecords
      tags: [workspace-records]
      summary: Create missing agency records without overwriting existing ones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencyBatchCreateInput"
      responses:
        "200":
          description: IDs that were created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencyBatchCreateResponse"
  /evidence/workspaces/{workspaceId}/role:
    get:
      operationId: getEvidenceWorkspaceRole
      tags: [reviewed-evidence]
      summary: Resolve the signed-in user's workspace role
      description: Requires a valid Replit Auth session and existing workspace membership.
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
      responses:
        "200":
          description: Membership role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceRoleResponse"
        "401":
          description: A verified sign-in is required
        "403":
          description: Workspace membership is not granted
  /evidence/workspaces/{workspaceId}/agencies/{agencyKey}:
    get:
      operationId: listReviewedEvidence
      tags: [reviewed-evidence]
      summary: Read a bounded page of published evidence
      description: Requires a valid Replit Auth session and existing workspace membership.
      parameters:
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
        - in: path
          name: agencyKey
          required: true
          schema:
            type: string
            maxLength: 120
        - in: header
          name: X-After
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Public-source evidence and cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewedEvidencePage"
  /evidence:
    post:
      operationId: publishReviewedEvidence
      tags: [reviewed-evidence]
      summary: Publish a new public-source observation
      description: Requires a valid Replit Auth session and editor membership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishReviewedEvidenceInput"
      responses:
        "200":
          description: Created, or the identical immutable record already existed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewedEvidenceWriteResponse"
        "409":
          description: The immutable record ID conflicts with different evidence
  /evidence/workspaces/{workspaceId}/agencies/{agencyKey}/facts/{factId}/decisions:
    get:
      operationId: listReviewedEvidenceDecisions
      tags: [reviewed-evidence]
      summary: Read immutable review decisions for an evidence item
      description: Requires a valid Replit Auth session and existing workspace membership.
      parameters:
        - in: path
          name: factId
          required: true
          schema:
            type: string
            maxLength: 100
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
        - in: path
          name: agencyKey
          required: true
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: Review decision history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceDecisionsResponse"
    post:
      operationId: createReviewedEvidenceDecision
      tags: [reviewed-evidence]
      summary: Add an immutable reviewer decision
      description: Requires a valid Replit Auth session and reviewer membership.
      parameters:
        - in: path
          name: factId
          required: true
          schema:
            type: string
            maxLength: 100
        - in: path
          name: workspaceId
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
        - in: path
          name: agencyKey
          required: true
          schema:
            type: string
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordEvidenceDecisionInput"
      responses:
        "200":
          description: Decision created or identical decision already existed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewedEvidenceWriteResponse"
        "409":
          description: A different immutable decision already exists
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Auth status resolved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start browser OIDC login
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete browser OIDC login
      responses:
        "302":
          description: Redirect to the validated return path or login
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the browser session and end OIDC session
      responses:
        "302":
          description: Redirect to the OIDC end-session endpoint
  /fema/afg-grants:
    get:
      operationId: getAfgGrants
      tags: [territory]
      summary: Search public FEMA AFG grant records
      parameters:
        - in: query
          name: stateCode
          schema:
            type: string
        - in: query
          name: recipientName
          description: Text to match in the OpenFEMA grantee name; this is not a geographic city match.
          schema:
            type: string
            maxLength: 180
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: FEMA grant records and source metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AfgGrantsResponse"
  /providers/verify-live:
    post:
      operationId: verifyProviderLive
      tags: [territory]
      summary: Verify provider identity against public registries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderVerificationInput"
      responses:
        "200":
          description: Public registry match and verification status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderVerificationResponse"
        "400":
          description: Invalid verification request
  /fire-registry/matches:
    get:
      operationId: getFireRegistryMatches
      tags: [territory]
      summary: Find public USFA and NERIS fire department records
      description: Returns separate source records and possible name/location matches; it never updates an app agency record.
      parameters:
        - in: query
          name: agencyName
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 180
        - in: query
          name: city
          schema:
            type: string
            maxLength: 120
        - in: query
          name: stateCode
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z]{2}$"
        - in: query
          name: fdid
          schema:
            type: string
            maxLength: 20
      responses:
        "200":
          description: Public registry candidates, station rows, and source freshness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FireRegistryMatchesResponse"
        "400":
          description: Invalid search parameters
  /ems-registry/matches:
    get:
      operationId: getEmsRegistryMatches
      tags: [territory]
      summary: Search CMS NPPES organization records for an EMS agency
      description: Returns Type 2 NPI records as separate candidates; it does not verify EMS licensing or operations.
      parameters:
        - in: query
          name: agencyName
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 180
        - in: query
          name: city
          schema:
            type: string
            maxLength: 120
        - in: query
          name: stateCode
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z]{2}$"
      responses:
        "200":
          description: NPPES organization candidates and retrieval metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmsRegistryMatchesResponse"
        "400":
          description: Invalid search parameters
  /geography/nri-county-context:
    get:
      operationId: getNriCountyContext
      tags: [territory]
      summary: Retrieve FEMA National Risk Index county records
      description: Returns county-level FEMA risk context. A stateCode limits the response to one state; without it, all available counties are returned. State totals are derived by summing county expected annual loss values only when county coverage is complete.
      parameters:
        - in: query
          name: stateCode
          schema:
            type: string
            pattern: "^[A-Za-z]{2}$"
      responses:
        "200":
          description: County risk values with source, version, and retrieval metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NriCountyContextResponse"
        "400":
          description: Invalid state code
        "502":
          description: FEMA risk records are temporarily unavailable
  /gemini/chat:
    post:
      operationId: sendTerritoryResearchMessage
      tags: [research]
      summary: Ask Gemini a territory research question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerritoryResearchInput"
      responses:
        "200":
          description: Research response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerritoryResearchResponse"
        "503":
          description: AI research service is unavailable
  /gemini/maps-grounding:
    post:
      operationId: searchGroundedPlaces
      tags: [research]
      summary: Search for places using grounded research
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlacesResearchInput"
      responses:
        "200":
          description: Research answer with source links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacesResearchResponse"
        "503":
          description: Maps-grounded research is unavailable
components:
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
          format: email
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    AgencyRecord:
      type: object
      properties:
        id:
          type: string
        revision:
          type: integer
        agency:
          type: object
          additionalProperties: true
      required: [id, revision, agency]
    AgencyRecordPage:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/AgencyRecord"
        nextCursor:
          type: [string, "null"]
      required: [records, nextCursor]
    AgencyRecordUpdate:
      type: object
      properties:
        expectedRevision:
          type: integer
          minimum: 0
        agency:
          type: object
          additionalProperties: true
      required: [expectedRevision, agency]
    AgencyMutationInput:
      type: object
      properties:
        mutationId:
          type: string
          maxLength: 300
        expectedRevision:
          type: integer
          minimum: 0
        agency:
          type: object
          additionalProperties: true
      required: [mutationId, expectedRevision, agency]
    AgencyMutationResponse:
      type: object
      properties:
        id:
          type: string
        revision:
          type: integer
        agency:
          type: object
          additionalProperties: true
      required: [id, revision, agency]
    AgencyBatchCreateInput:
      type: object
      properties:
        records:
          type: array
          maxItems: 25
          items:
            type: object
            additionalProperties: true
      required: [records]
    AgencyBatchCreateResponse:
      type: object
      properties:
        createdIds:
          type: array
          items:
            type: string
      required: [createdIds]
    EvidenceRoleResponse:
      type: object
      properties:
        role:
          type: string
          enum: [viewer, editor, reviewer]
      required: [role]
    ReviewedEvidence:
      type: object
      properties:
        evidence:
          type: object
          additionalProperties: true
        authorUid:
          type: string
        authorIdentityMapped:
          type: boolean
        publishedAt:
          type: string
          format: date-time
      required: [evidence, authorUid, authorIdentityMapped, publishedAt]
    ReviewedEvidencePage:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/ReviewedEvidence"
        withheld:
          type: integer
        next:
          type: [string, "null"]
      required: [records, withheld, next]
    PublishReviewedEvidenceInput:
      type: object
      properties:
        workspaceId:
          type: string
        evidence:
          type: object
          additionalProperties: true
      required: [workspaceId, evidence]
    RecordEvidenceDecisionInput:
      type: object
      properties:
        workspaceId:
          type: string
        agencyKey:
          type: string
        draft:
          type: object
          additionalProperties: true
      required: [workspaceId, agencyKey, draft]
    EvidenceDecision:
      type: object
      properties:
        action:
          type: string
        reason:
          type: string
        replacementId:
          type: string
        factId:
          type: string
        reviewerUid:
          type: string
        reviewerIdentityMapped:
          type: boolean
        reviewedAt:
          type: string
          format: date-time
      required: [action, reason, replacementId, factId, reviewerUid, reviewerIdentityMapped, reviewedAt]
    EvidenceDecisionsResponse:
      type: object
      properties:
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceDecision"
        invalid:
          type: integer
        status:
          type: string
          enum: [pending, approved, challenged, withdrawn, superseded, unavailable]
      required: [decisions, invalid, status]
    ReviewedEvidenceWriteResponse:
      type: object
      properties:
        result:
          type: string
          enum: [created, exists]
      required: [result]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AfgGrant:
      type: object
      additionalProperties: true
    AfgGrantsResponse:
      type: object
      properties:
        awards:
          type: array
          items:
            $ref: "#/components/schemas/AfgGrant"
        source:
          type: string
        fetchedAt:
          type: string
          format: date-time
        count:
          type: integer
    ProviderVerificationInput:
      type: object
      properties:
        agencyName:
          type: string
        city:
          type: string
        county:
          type: string
        stateCode:
          type: string
        zipCode:
          type: string
        category:
          type: string
          enum: [all, ems, fire]
        npiNumber:
          type: string
      required: [agencyName]
    ProviderVerificationResponse:
      type: object
      properties:
        outcome:
          type: string
          enum: [MATCHED, NOT_MATCHED]
        verified:
          type: boolean
        matchConfidence:
          type: number
        matchReasons:
          type: array
          items:
            type: string
        verificationSource:
          type: string
        npiNumber:
          type: string
        address:
          type: string
        zipCode:
          type: string
        taxonomyCode:
          type: string
        taxonomyDescription:
          type: string
        nppesOfficialName:
          type: string
        nppesOfficialTitle:
          type: string
        nppesLastUpdated:
          type: string
        officialWebsite:
          type: string
        googleMapsUri:
          type: string
        details:
          type: string
        usfaRegistryUrl:
          type: string
        liveFemaAwards:
          type: array
          items:
            type: object
            additionalProperties: true
        authorizedOfficial:
          type: [object, "null"]
          additionalProperties: true
        allCityNpiProviders:
          type: array
          items:
            type: object
            additionalProperties: true
    FireRegistryStation:
      type: object
      properties:
        source:
          type: string
          enum: [USFA NFDR, NERIS]
        sourceRecordId:
          type: ["string", "null"]
        sourceUrl:
          type: string
          format: uri
        name:
          type: string
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        stateCode:
          type: string
        postalCode:
          type: ["string", "null"]
        unitCount:
          type: ["integer", "null"]
        exportDate:
          type: ["string", "null"]
          format: date-time
      required:
        - source
        - sourceRecordId
        - sourceUrl
        - name
        - address
        - city
        - stateCode
        - postalCode
        - unitCount
        - exportDate
    FireRegistryUnit:
      type: object
      properties:
        sourceRecordId:
          type: string
        sourceUrl:
          type: string
          format: uri
        departmentNerisId:
          type: string
        stationNerisId:
          type: ["string", "null"]
        stationName:
          type: ["string", "null"]
        unitType:
          type: ["string", "null"]
        cadDesignation1:
          type: ["string", "null"]
        cadDesignation2:
          type: ["string", "null"]
        dedicatedStaffing:
          type: ["string", "null"]
        exportDate:
          type: ["string", "null"]
          format: date-time
      required:
        - sourceRecordId
        - sourceUrl
        - departmentNerisId
        - stationNerisId
        - stationName
        - unitType
        - cadDesignation1
        - cadDesignation2
        - dedicatedStaffing
        - exportDate
    FireRegistryJurisdiction:
      type: object
      properties:
        sourceRecordId:
          type: string
        sourceUrl:
          type: string
          format: uri
        name:
          type: ["string", "null"]
        regionType:
          type: ["string", "null"]
        entityType:
          type: ["string", "null"]
        departmentType:
          type: ["string", "null"]
        exportDate:
          type: ["string", "null"]
          format: date-time
        boundaryAvailableAtSource:
          type: boolean
      required:
        - sourceRecordId
        - sourceUrl
        - name
        - regionType
        - entityType
        - departmentType
        - exportDate
        - boundaryAvailableAtSource
    NriCountyContextRecord:
      type: object
      properties:
        countyFips:
          type: string
          pattern: "^[0-9]{5}$"
        countyName:
          type: string
        stateCode:
          type: string
          pattern: "^[A-Z]{2}$"
        population:
          type: ["number", "null"]
        riskScore:
          type: ["number", "null"]
        riskRating:
          type: ["string", "null"]
        expectedAnnualLoss:
          type: ["number", "null"]
        expectedAnnualLossScore:
          type: ["number", "null"]
        expectedAnnualLossRating:
          type: ["string", "null"]
        socialVulnerabilityScore:
          type: ["number", "null"]
        socialVulnerabilityRating:
          type: ["string", "null"]
        communityResilienceScore:
          type: ["number", "null"]
        communityResilienceRating:
          type: ["string", "null"]
        sourceVersion:
          type: string
        sourceUrl:
          type: string
          format: uri
      required:
        - countyFips
        - countyName
        - stateCode
        - population
        - riskScore
        - riskRating
        - expectedAnnualLoss
        - expectedAnnualLossScore
        - expectedAnnualLossRating
        - socialVulnerabilityScore
        - socialVulnerabilityRating
        - communityResilienceScore
        - communityResilienceRating
        - sourceVersion
        - sourceUrl
    NriCountyContextResponse:
      type: object
      properties:
        fetchedAt:
          type: string
          format: date-time
        stateCode:
          type: ["string", "null"]
        sourceUrl:
          type: string
          format: uri
        sourceVersion:
          type: string
        records:
          type: array
          items:
            $ref: "#/components/schemas/NriCountyContextRecord"
      required: [fetchedAt, stateCode, sourceUrl, sourceVersion, records]
    FireRegistrySourceStatus:
      type: object
      properties:
        source:
          type: string
          enum: [USFA NFDR, NERIS]
        status:
          type: string
          enum: [available, loading, unavailable]
        sourceUrl:
          type: string
          format: uri
        fetchedAt:
          type: ["string", "null"]
          format: date-time
        recordCount:
          type: integer
        errorMessage:
          type: ["string", "null"]
      required:
        - source
        - status
        - sourceUrl
        - fetchedAt
        - recordCount
        - errorMessage
    FireRegistryCandidate:
      type: object
      properties:
        source:
          type: string
          enum: [USFA NFDR, NERIS]
        sourceRecordId:
          type: string
        sourceUrl:
          type: string
          format: uri
        agencyName:
          type: string
        stateCode:
          type: string
        city:
          type: ["string", "null"]
        county:
          type: ["string", "null"]
