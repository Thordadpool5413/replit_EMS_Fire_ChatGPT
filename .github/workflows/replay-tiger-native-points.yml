name: Replay complete native TIGER range points
on:
  push:
    branches: [atlas/recover-native-sources]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tiger-range:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[replay-native-tiger]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact native range guards
        run: |
          set -euo pipefail
          python3 -m pip install 'pyshp==2.3.1'
          python3 -m unittest discover -s scripts/data -p test_tiger_primary.py
      - name: Retain complete range geometry replay
        run: |
          set -euo pipefail
          python3 -u scripts/data/retain_tiger_primary.py --additional-targets scripts/data/evidence/primary-neris-mailing-sites/2026-11-26/targets.json --report "$RUNNER_TEMP/tiger-primary.json"
          python3 -u scripts/data/retain_tiger_primary.py --verify
          python3 -u scripts/data/build_tiger_point_contract.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-tiger-range-points
          path: scripts/data/evidence/primary-tiger-native/
      - name: Commit fully replayed native range evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "atlas/native-tiger-points-$GITHUB_RUN_ID"
          git add --force scripts/data/evidence/primary-tiger-native scripts/fixtures/tiger-primary-point-examples.json artifacts/ems-territory-intelligence/src/services/tigerPrimaryPointPins.ts artifacts/api-server/src/lib/tigerPrimaryPointPins.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Retain source-native TIGER range geometry with complete target and conflict replay'
          git push origin HEAD
