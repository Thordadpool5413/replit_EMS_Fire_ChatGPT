name: Profile presentation
on:
  pull_request:
    paths:
      - 'artifacts/ems-territory-intelligence/**'
      - 'scripts/check-profile-*.mjs'
      - 'scripts/check-mobile-*.mjs'
      - 'scripts/check-national-registry-integrity.mjs'
      - 'scripts/audit-production-providers*.mjs'
      - 'artifacts/api-server/src/lib/fireRegistry.ts'
      - 'artifacts/api-server/src/routes/fire-registry.ts'
      - 'artifacts/api-server/src/lib/publicIntelligenceDiscovery*'
      - 'artifacts/api-server/src/lib/federal*'
      - 'artifacts/api-server/src/lib/municipal*'
      - 'artifacts/api-server/src/lib/chicago*'
      - 'artifacts/api-server/src/lib/providerLocation*'
      - 'scripts/data/stage_nppes.py'
      - 'scripts/data/test_stage_nppes.py'
      - 'scripts/data/backfill_provider_locations.py'
      - 'scripts/data/test_backfill_provider_locations.py'
      - 'scripts/data/recover_nad_locations.py'
      - 'scripts/data/recover_ohio_locations.py'
      - 'scripts/data/test_recover_ohio_locations.py'
      - '.github/workflows/ohio-provider-locations.yml'
      - 'scripts/data/recover_census_locations.py'
      - 'scripts/data/test_recover_census_locations.py'
      - 'scripts/data/test_recover_nad_locations.py'
      - '.github/workflows/nad-provider-locations.yml'
      - '.github/workflows/national-provider-locations.yml'
      - 'scripts/build-national-source-directory.py'
      - 'artifacts/api-server/src/lib/sam*'
      - 'artifacts/api-server/src/lib/recurringDiscovery*'
      - '.github/workflows/atlas-recurring-discovery.yml'
      - 'artifacts/api-server/src/routes/public-intelligence-discovery.ts'
      - 'artifacts/api-server/src/routes/index.ts'
      - 'scripts/test-ems-unit.mjs'
      - 'security/**'
      - '.github/workflows/profile-presentation.yml'
  push:
    branches: [main]
    paths:
      - 'artifacts/ems-territory-intelligence/**'
      - 'scripts/check-profile-*.mjs'
      - 'scripts/check-mobile-*.mjs'
      - 'scripts/check-national-registry-integrity.mjs'
      - 'scripts/audit-production-providers*.mjs'
      - 'artifacts/api-server/src/lib/fireRegistry.ts'
      - 'artifacts/api-server/src/routes/fire-registry.ts'
      - 'artifacts/api-server/src/lib/publicIntelligenceDiscovery*'
      - 'artifacts/api-server/src/lib/federal*'
      - 'artifacts/api-server/src/lib/municipal*'
      - 'artifacts/api-server/src/lib/chicago*'
      - 'artifacts/api-server/src/lib/providerLocation*'
      - 'scripts/data/stage_nppes.py'
      - 'scripts/data/test_stage_nppes.py'
      - 'scripts/data/backfill_provider_locations.py'
      - 'scripts/data/test_backfill_provider_locations.py'
      - 'scripts/data/recover_nad_locations.py'
      - 'scripts/data/recover_ohio_locations.py'
      - 'scripts/data/test_recover_ohio_locations.py'
      - '.github/workflows/ohio-provider-locations.yml'
      - 'scripts/data/recover_census_locations.py'
      - 'scripts/data/test_recover_census_locations.py'
      - 'scripts/data/test_recover_nad_locations.py'
      - '.github/workflows/nad-provider-locations.yml'
      - '.github/workflows/national-provider-locations.yml'
      - 'scripts/build-national-source-directory.py'
      - 'artifacts/api-server/src/lib/sam*'
      - 'artifacts/api-server/src/lib/recurringDiscovery*'
      - '.github/workflows/atlas-recurring-discovery.yml'
      - 'artifacts/api-server/src/routes/public-intelligence-discovery.ts'
      - 'artifacts/api-server/src/routes/index.ts'
      - 'scripts/test-ems-unit.mjs'
      - 'security/**'
      - '.github/workflows/profile-presentation.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PORT: '5173'
      BASE_PATH: '/'
      PROFILE_TEST_URL: 'http://127.0.0.1:5173/'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Visual-only parity
        if: github.event_name == 'pull_request' && github.head_ref == 'design/agency-profile-warm-redesign'
        env:
          PROFILE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-profile-presentation-scope.mjs
      - run: node scripts/check-national-registry-integrity.mjs
      - run: node scripts/check-ems-source-coverage.mjs
      - run: node --test scripts/refresh-ohio-state-ems.test.mjs
      - run: node --test scripts/audit-production-providers.test.mjs
      - run: python3 -m unittest discover -s scripts/data -p 'test_*.py'
      - name: Verify bundled public location snapshot if present
        run: |
          if test -f artifacts/ems-territory-intelligence/public/registry/locations/index.json; then
            python3 scripts/data/backfill_provider_locations.py --verify
          else
            echo 'No generated location snapshot in this revision.'
          fi
      - run: node scripts/test-ems-unit.mjs
      - run: pnpm run typecheck
      - run: pnpm --dir artifacts/api-server run build
      - run: node scripts/check-style-ownership.mjs
      - run: pnpm --dir artifacts/ems-territory-intelligence run build
      - name: Install browser for responsive profile checks
        run: |
          npx --yes --package=@playwright/test playwright install --with-deps chromium
          CHROME_BIN=$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux*/chrome' -type f | head -n 1)
          test -n "$CHROME_BIN"
          mkdir -p "$RUNNER_TEMP/profile-bin"
          ln -s "$CHROME_BIN" "$RUNNER_TEMP/profile-bin/chromium"
          echo "$RUNNER_TEMP/profile-bin" >> "$GITHUB_PATH"
      - name: Start production preview
        id: preview
        run: |
          pnpm --dir artifacts/ems-territory-intelligence exec vite preview --host 127.0.0.1 > "$RUNNER_TEMP/profile-preview.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/profile-preview.log"
          exit 1
      - name: Responsive mobile map and control checks
        run: node scripts/check-mobile-field-polish.mjs
      - name: Responsive read-only profile checks
        if: always() && steps.preview.outcome == 'success'
        run: node scripts/check-profile-redesign.mjs
      - name: Keep layout measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-presentation
          path: |
            generated-artifacts/profile-redesign/
            generated-artifacts/mobile-field-polish/
          if-no-files-found: ignore

  evidence-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run isolated Firestore rule tests
        shell: bash
        run: |
          set -euo pipefail
          TEST_DIR=$(mktemp -d)
          cp security/atlas-evidence.firestore.rules security/atlas-evidence.rules.test.mjs "$TEST_DIR/"
          cp security/atlas-evidence.emulator.json "$TEST_DIR/firebase.json"
          cd "$TEST_DIR"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact firebase@13.0.0 @firebase/rules-unit-testing@6.0.0 firebase-tools@15.36.0
          CI=true ./node_modules/.bin/firebase emulators:exec --only firestore --project demo-atlas-evidence --config firebase.json 'node --test atlas-evidence.rules.test.mjs'
