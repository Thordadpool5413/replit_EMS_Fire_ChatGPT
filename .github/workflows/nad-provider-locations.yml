name: Secondary public provider location recovery
on:
  push:
    branches: [atlas/nad-location-recovery, atlas/nad-location-recovery-v2]
    paths:
      - 'scripts/data/recover_nad_locations.py'
      - 'scripts/data/test_recover_nad_locations.py'
      - 'scripts/data/check_additive_location_release.py'
      - '.github/workflows/nad-provider-locations.yml'
      - 'scripts/data/recover_census_locations.py'
      - 'scripts/data/test_recover_census_locations.py'
  workflow_dispatch:
    inputs:
      states:
        description: "all or comma-separated state codes"
        default: FL,OH
        type: string
permissions:
  contents: read
concurrency:
  group: atlas-nad-provider-location-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/atlas/nad-location-recovery' || github.ref == 'refs/heads/atlas/nad-location-recovery-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate matching rules
        run: python3 -m unittest discover -s scripts/data -p 'test_*.py'
      - name: Retry normalized physical addresses nationwide
        if: github.ref_name != 'atlas/nad-location-recovery-v2'
        id: census
        continue-on-error: true
        run: python3 scripts/data/recover_census_locations.py
      - name: Publish Census retry review branch
        if: steps.census.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- artifacts/ems-territory-intelligence/public/registry/locations
          git diff --cached --quiet || git commit -m "Recover exact component matches from normalized Census retry"
          git push origin "HEAD:refs/heads/atlas/census-retry-data-${GITHUB_RUN_ID}"
          echo "Census review branch: atlas/census-retry-data-${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve verified base before NAD retry
        run: cp -a artifacts/ems-territory-intelligence/public/registry/locations "$RUNNER_TEMP/nad-base"
      - name: Recover unmatched public organization addresses
        id: nad
        continue-on-error: true
        env:
          ATLAS_NAD_STATES: ${{ inputs.states || 'FL,OH' }}
        run: |
          if [ "$GITHUB_REF_NAME" = "atlas/nad-location-recovery-v2" ]; then
            python3 scripts/data/recover_nad_locations.py --states "$ATLAS_NAD_STATES" --max-requests 30 --batch-size 1
          else
            python3 scripts/data/recover_nad_locations.py --states "$ATLAS_NAD_STATES" --max-requests 100
          fi
      - name: Publish review-only data branch
        if: steps.nad.outcome == 'success'
        run: |
          set -euo pipefail
          python3 scripts/data/backfill_provider_locations.py --verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- artifacts/ems-territory-intelligence/public/registry/locations
          if git diff --cached --quiet; then
            echo "NAD query completed; no additional validated points. No candidate published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/data/check_additive_location_release.py --base "$RUNNER_TEMP/nad-base" --candidate artifacts/ems-territory-intelligence/public/registry/locations
          git commit -m "Recover exact public provider address points from USDOT NAD"
          branch="atlas/nad-location-data-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"
          echo "Review branch: $branch" >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json; x=json.load(open("artifacts/ems-territory-intelligence/public/registry/locations/index.json")); print(json.dumps({"coverage":x["coverage"],"nadRecovery":x["nadRecovery"]},indent=2))' >> "$GITHUB_STEP_SUMMARY"
      - name: Report source failure explicitly
        if: steps.census.outcome == 'failure' || steps.nad.outcome == 'failure'
        run: |
          echo 'One or more recovery sources failed. Any independently published review branch is still subject to validation.'
          exit 1
      - name: Retain coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nad-provider-location-coverage
          path: artifacts/ems-territory-intelligence/public/registry/locations/index.json
          if-no-files-found: ignore
