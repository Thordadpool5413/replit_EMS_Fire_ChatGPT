  push:
    branches: [main]
    paths:
      - 'artifacts/ems-territory-intelligence/**'
      - 'scripts/check-profile-*.mjs'
      - 'scripts/check-mobile-*.mjs'
      - 'scripts/check-national-registry-integrity.mjs'
      - 'artifacts/api-server/src/lib/fireRegistry.ts'
      - 'artifacts/api-server/src/routes/fire-registry.ts'
      - 'artifacts/api-server/src/lib/publicIntelligenceDiscovery*'
      - 'artifacts/api-server/src/lib/federal*'
      - 'artifacts/api-server/src/lib/municipal*'
      - 'artifacts/api-server/src/lib/chicago*'
      - 'artifacts/api-server/src/lib/providerLocation*'
      - 'scripts/data/stage_nppes.py'
      - 'scripts/data/test_stage_nppes.py'
      - 'scripts/data/backfill_provider_locations.py'
      - 'scripts/data/test_backfill_provider_locations.py'
      - 'scripts/data/recover_nad_locations.py'
      - '.github/workflows/nad-provider-locations.yml'
      - 'scripts/data/recover_ny_locations.py'
      - 'scripts/data/recover_regional_locations.py'
      - 'scripts/data/regional_point_contract.py'
      - 'scripts/data/test_recover_regional_locations.py'
      - 'scripts/data/audit_location_gaps.py'
      - 'scripts/data/audit_facility_reconciliation.py'
      - 'scripts/data/test_facility_reconciliation.py'
      - 'scripts/data/facility_research_candidates.json'
      - 'scripts/data/check_additive_location_release.py'
      - 'scripts/data/test_location_recovery_release.py'
      - '.github/workflows/regional-address-recovery.yml'
      - 'scripts/data/recover_nad_bulk_locations.py'
      - 'scripts/data/checked_zip_member.py'
      - 'scripts/data/test_checked_zip_member.py'
      - 'scripts/data/test_recover_national_points.py'
      - '.github/workflows/national-address-point-recovery.yml'
      - 'scripts/data/recover_ohio_locations.py'
      - 'scripts/data/test_recover_ohio_locations.py'
      - '.github/workflows/ohio-provider-locations.yml'
      - 'scripts/data/recover_census_locations.py'
      - 'scripts/data/test_recover_census_locations.py'
      - 'scripts/data/test_recover_nad_locations.py'
      - '.github/workflows/national-provider-locations.yml'
      - 'scripts/build-national-source-directory.py'
      - 'artifacts/api-server/src/lib/sam*'
      - 'artifacts/api-server/src/lib/recurringDiscovery*'
      - '.github/workflows/atlas-recurring-discovery.yml'
      - 'artifacts/api-server/src/routes/public-intelligence-discovery.ts'
      - 'artifacts/api-server/src/**'
      - 'artifacts/api-server/package.json'
      - 'lib/db/**'
      - 'lib/replit-auth-web/**'
      - 'scripts/src/replitImportFormat.ts'
      - 'scripts/src/import-replit-records*.ts'
      - 'scripts/package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/test-ems-unit.mjs'
      - 'scripts/pwa-worker.test.mjs'
      - 'security/**'
      - '.github/workflows/profile-presentation.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PORT: '5173'
      BASE_PATH: '/'
      PROFILE_TEST_URL: 'http://127.0.0.1:5173/'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Visual-only parity
        if: github.event_name == 'pull_request' && github.head_ref == 'design/agency-profile-warm-redesign'
        env:
          PROFILE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-profile-presentation-scope.mjs
      - run: node scripts/check-national-registry-integrity.mjs
      - run: node scripts/check-ems-source-coverage.mjs
      - run: node --test scripts/refresh-ohio-state-ems.test.mjs
      - run: pnpm --filter @workspace/scripts run test:replit-migration
      - run: python3 -m unittest discover -s scripts/data -p 'test_*.py'
      - name: Verify bundled public location snapshot if present
        run: |
          if test -f artifacts/ems-territory-intelligence/public/registry/locations/index.json; then
            python3 scripts/data/backfill_provider_locations.py --verify
          else
            echo 'No generated location snapshot in this revision.'
          fi
      - name: Generate nationwide mapping gap report
        run: |
          if test -f artifacts/ems-territory-intelligence/public/registry/locations/index.json; then
            python3 scripts/data/audit_location_gaps.py --json generated-artifacts/location-recovery/gaps.json --markdown generated-artifacts/location-recovery/gaps.md
            cat generated-artifacts/location-recovery/gaps.md >> "$GITHUB_STEP_SUMMARY"
            python3 scripts/data/audit_facility_reconciliation.py --output generated-artifacts/location-recovery/facility-review.json
          fi
      - name: Keep mapping coverage report
        uses: actions/upload-artifact@v4
        with:
          name: provider-location-gaps
          path: generated-artifacts/location-recovery/
          if-no-files-found: ignore
      - run: node scripts/test-ems-unit.mjs
      - name: Verify PWA cache and offline safety
        run: node --test scripts/pwa-worker.test.mjs
      - run: pnpm run typecheck
      - run: pnpm --dir artifacts/api-server run build
      - run: node scripts/check-style-ownership.mjs
      - run: pnpm --dir artifacts/ems-territory-intelligence run build
      - name: Install browser for responsive profile checks
        run: |
          npx --yes --package=@playwright/test playwright install --with-deps chromium
          CHROME_BIN=$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux*/chrome' -type f | head -n 1)
          test -n "$CHROME_BIN"
          mkdir -p "$RUNNER_TEMP/profile-bin"
          ln -s "$CHROME_BIN" "$RUNNER_TEMP/profile-bin/chromium"
          echo "$RUNNER_TEMP/profile-bin" >> "$GITHUB_PATH"
      - name: Start production preview
        id: preview
        run: |
          pnpm --dir artifacts/ems-territory-intelligence exec vite preview --host 127.0.0.1 > "$RUNNER_TEMP/profile-preview.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/profile-preview.log"
          exit 1
      - name: Responsive mobile map and control checks
        run: node scripts/check-mobile-field-polish.mjs
      - name: Responsive read-only profile checks
        if: always() && steps.preview.outcome == 'success'
        run: node scripts/check-profile-redesign.mjs
      - name: Keep layout measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-presentation
          path: |
            generated-artifacts/profile-redesign/
            generated-artifacts/mobile-field-polish/
          if-no-files-found: ignore

  evidence-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atlas_ci
          POSTGRES_PASSWORD: atlas_ci_local_only
          POSTGRES_DB: atlas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_ci -d atlas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://atlas_ci:atlas_ci_local_only@127.0.0.1:5432/atlas_ci
      ATLAS_EVIDENCE_CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision disposable test schema
        run: pnpm --filter @workspace/db run push-force
      - name: Verify Replit evidence authorization and immutability
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/routes/shared-evidence.integration.test.ts
      - name: Verify saved agency access and revision protection
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/routes/agency-records.integration.test.ts

      - name: Verify private station observations
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/routes/facility-notes.integration.test.ts

      - name: Verify station equipment evidence and independent review
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/routes/facility-equipment.integration.test.ts
      - name: Verify private decision authority evidence
        run: pnpm --filter @workspace/scripts exec tsx --test ../artifacts/api-server/src/routes/agency-authority.integration.test.ts
