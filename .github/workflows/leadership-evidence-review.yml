name: Public leadership evidence review
on:
  pull_request:
    paths:
      - 'research/leadership/**'
      - 'scripts/data/audit_leadership_candidates.py'
      - 'scripts/data/test_audit_leadership_candidates.py'
      - '.github/workflows/leadership-evidence-review.yml'
  push:
    branches: [main]
    paths:
      - 'research/leadership/**'
      - 'scripts/data/audit_leadership_candidates.py'
      - 'scripts/data/test_audit_leadership_candidates.py'
      - '.github/workflows/leadership-evidence-review.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/data -p test_audit_leadership_candidates.py
      - run: python3 scripts/data/audit_leadership_candidates.py --output generated-artifacts/leadership-review/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: leadership-review
          path: generated-artifacts/leadership-review/summary.json
