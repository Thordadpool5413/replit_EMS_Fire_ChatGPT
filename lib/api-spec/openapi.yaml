openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: territory
    description: Public-data lookups for EMS and fire territories
  - name: research
    description: Gemini-backed territory research
paths:
  /:
    get:
      operationId: apiRoot
      tags: [health]
      summary: API root health check
      description: Returns server health status at the API base path
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /fema/afg-grants:
    get:
      operationId: getAfgGrants
      tags: [territory]
      summary: Search public FEMA AFG grant records
      parameters:
        - in: query
          name: stateCode
          schema:
            type: string
        - in: query
          name: recipientName
          description: Text to match in the OpenFEMA grantee name; this is not a geographic city match.
          schema:
            type: string
            maxLength: 180
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: FEMA grant records and source metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AfgGrantsResponse"
  /providers/verify-live:
    post:
      operationId: verifyProviderLive
      tags: [territory]
      summary: Verify provider identity against public registries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderVerificationInput"
      responses:
        "200":
          description: Public registry match and verification status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderVerificationResponse"
        "400":
          description: Invalid verification request
  /fire-registry/matches:
    get:
      operationId: getFireRegistryMatches
      tags: [territory]
      summary: Find public USFA and NERIS fire department records
      description: Returns separate source records and possible name/location matches; it never updates an app agency record.
      parameters:
        - in: query
          name: agencyName
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 180
        - in: query
          name: city
          schema:
            type: string
            maxLength: 120
        - in: query
          name: stateCode
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z]{2}$"
        - in: query
          name: fdid
          schema:
            type: string
            maxLength: 20
      responses:
        "200":
          description: Public registry candidates, station rows, and source freshness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FireRegistryMatchesResponse"
        "400":
          description: Invalid search parameters
  /ems-registry/matches:
    get:
      operationId: getEmsRegistryMatches
      tags: [territory]
      summary: Search CMS NPPES organization records for an EMS agency
      description: Returns Type 2 NPI records as separate candidates; it does not verify EMS licensing or operations.
      parameters:
        - in: query
          name: agencyName
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 180
        - in: query
          name: city
          schema:
            type: string
            maxLength: 120
        - in: query
          name: stateCode
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z]{2}$"
      responses:
        "200":
          description: NPPES organization candidates and retrieval metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmsRegistryMatchesResponse"
        "400":
          description: Invalid search parameters
  /geography/nri-county-context:
    get:
      operationId: getNriCountyContext
      tags: [territory]
      summary: Retrieve FEMA National Risk Index county records
      description: Returns county-level FEMA risk context. A stateCode limits the response to one state; without it, all available counties are returned. State totals are derived by summing county expected annual loss values only when county coverage is complete.
      parameters:
        - in: query
          name: stateCode
          schema:
            type: string
            pattern: "^[A-Za-z]{2}$"
      responses:
        "200":
          description: County risk values with source, version, and retrieval metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NriCountyContextResponse"
        "400":
          description: Invalid state code
        "502":
          description: FEMA risk records are temporarily unavailable
  /gemini/chat:
    post:
      operationId: sendTerritoryResearchMessage
      tags: [research]
      summary: Ask Gemini a territory research question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerritoryResearchInput"
      responses:
        "200":
          description: Research response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerritoryResearchResponse"
        "503":
          description: AI research service is unavailable
  /gemini/maps-grounding:
    post:
      operationId: searchGroundedPlaces
      tags: [research]
      summary: Search for places using grounded research
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlacesResearchInput"
      responses:
        "200":
          description: Research answer with source links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacesResearchResponse"
        "503":
          description: Maps-grounded research is unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AfgGrant:
      type: object
      additionalProperties: true
    AfgGrantsResponse:
      type: object
      properties:
        awards:
          type: array
          items:
            $ref: "#/components/schemas/AfgGrant"
        source:
          type: string
        fetchedAt:
          type: string
          format: date-time
        count:
          type: integer
    ProviderVerificationInput:
      type: object
      properties:
        agencyName:
          type: string
        city:
          type: string
        county:
          type: string
        stateCode:
          type: string
        zipCode:
          type: string
        category:
          type: string
          enum: [all, ems, fire]
        npiNumber:
          type: string
      required: [agencyName]
    ProviderVerificationResponse:
      type: object
      properties:
        outcome:
          type: string
          enum: [MATCHED, NOT_MATCHED]
        verified:
          type: boolean
        matchConfidence:
          type: number
        matchReasons:
          type: array
          items:
            type: string
        verificationSource:
          type: string
        npiNumber:
          type: string
        address:
          type: string
        zipCode:
          type: string
        taxonomyCode:
          type: string
        taxonomyDescription:
          type: string
        nppesOfficialName:
          type: string
        nppesOfficialTitle:
          type: string
        nppesLastUpdated:
          type: string
        officialWebsite:
          type: string
        googleMapsUri:
          type: string
        details:
          type: string
        usfaRegistryUrl:
          type: string
        liveFemaAwards:
          type: array
          items:
            type: object
            additionalProperties: true
        authorizedOfficial:
          type: [object, "null"]
          additionalProperties: true
        allCityNpiProviders:
          type: array
          items:
            type: object
            additionalProperties: true
    FireRegistryStation:
      type: object
      properties:
        source:
          type: string
          enum: [USFA NFDR, NERIS]
        sourceRecordId:
          type: ["string", "null"]
        sourceUrl:
          type: string
          format: uri
        name:
          type: string
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        stateCode:
          type: string
        postalCode:
          type: ["string", "null"]
        unitCount:
          type: ["integer", "null"]
        exportDate:
          type: ["string", "null"]
          format: date-time
      required:
        - source
        - sourceRecordId
        - sourceUrl
        - name
        - address
        - city
        - stateCode
        - postalCode
        - unitCount
        - exportDate
    FireRegistryUnit:
      type: object
      properties:
        sourceRecordId:
          type: string
        sourceUrl:
          type: string
          format: uri
        departmentNerisId:
          type: string
        stationNerisId:
          type: ["string", "null"]
        stationName:
          type: ["string", "null"]
        unitType:
          type: ["string", "null"]
        cadDesignation1:
          type: ["string", "null"]
        cadDesignation2:
          type: ["string", "null"]
        dedicatedStaffing:
          type: ["string", "null"]
        exportDate:
          type: ["string", "null"]
          format: date-time
      required:
        - sourceRecordId
        - sourceUrl
        - departmentNerisId
        - stationNerisId
        - stationName
        - unitType
        - cadDesignation1
        - cadDesignation2
        - dedicatedStaffing
        - exportDate
    FireRegistryJurisdiction:
      type: object
      properties:
        sourceRecordId:
          type: string
        sourceUrl:
          type: string
          format: uri
        name:
          type: ["string", "null"]
        regionType:
          type: ["string", "null"]
        entityType:
          type: ["string", "null"]
        departmentType:
          type: ["string", "null"]
        exportDate:
          type: ["string", "null"]
          format: date-time
        boundaryAvailableAtSource:
          type: boolean
      required:
        - sourceRecordId
        - sourceUrl
        - name
        - regionType
        - entityType
        - departmentType
        - exportDate
        - boundaryAvailableAtSource
    NriCountyContextRecord:
      type: object
      properties:
        countyFips:
          type: string
          pattern: "^[0-9]{5}$"
        countyName:
          type: string
        stateCode:
          type: string
          pattern: "^[A-Z]{2}$"
        population:
          type: ["number", "null"]
        riskScore:
          type: ["number", "null"]
        riskRating:
          type: ["string", "null"]
        expectedAnnualLoss:
          type: ["number", "null"]
        expectedAnnualLossScore:
          type: ["number", "null"]
        expectedAnnualLossRating:
          type: ["string", "null"]
        socialVulnerabilityScore:
          type: ["number", "null"]
        socialVulnerabilityRating:
          type: ["string", "null"]
        communityResilienceScore:
          type: ["number", "null"]
        communityResilienceRating:
          type: ["string", "null"]
        sourceVersion:
          type: string
        sourceUrl:
          type: string
          format: uri
      required:
        - countyFips
        - countyName
        - stateCode
        - population
        - riskScore
        - riskRating
        - expectedAnnualLoss
        - expectedAnnualLossScore
        - expectedAnnualLossRating
        - socialVulnerabilityScore
        - socialVulnerabilityRating
        - communityResilienceScore
        - communityResilienceRating
        - sourceVersion
        - sourceUrl
    NriCountyContextResponse:
      type: object
      properties:
        fetchedAt:
          type: string
          format: date-time
        stateCode:
          type: ["string", "null"]
        sourceUrl:
          type: string
          format: uri
        sourceVersion:
          type: string
        records:
          type: array
          items:
            $ref: "#/components/schemas/NriCountyContextRecord"
      required: [fetchedAt, stateCode, sourceUrl, sourceVersion, records]
    FireRegistrySourceStatus:
      type: object
      properties:
        source:
          type: string
          enum: [USFA NFDR, NERIS]
        status:
          type: string
          enum: [available, loading, unavailable]
        sourceUrl:
          type: string
          format: uri
        fetchedAt:
          type: ["string", "null"]
          format: date-time
        recordCount:
          type: integer
        errorMessage:
          type: ["string", "null"]
      required:
        - source
        - status
        - sourceUrl
        - fetchedAt
        - recordCount
        - errorMessage
    FireRegistryCandidate:
      type: object
      properties:
        source:
          type: string
          enum: [USFA NFDR, NERIS]
        sourceRecordId:
          type: string
        sourceUrl:
          type: string
          format: uri
        agencyName:
          type: string
        stateCode:
          type: string
        city:
          type: ["string", "null"]
        county:
          type: ["string", "null"]
        headquartersAddress:
          type: ["string", "null"]
        fdid:
          type: ["string", "null"]
        nerisId:
          type: ["string", "null"]
        departmentType:
          type: ["string", "null"]
        organizationType:
          type: ["string", "null"]
        entityType:
          type: ["string", "null"]
        stationCount:
          type: ["integer", "null"]
        unitCount:
          type: ["integer", "null"]
        exportDate:
          type: ["string", "null"]
          format: date-time
        matchLevel:
          type: string
          enum: [strong_candidate, possible_candidate]
        matchReasons:
          type: array
          items:
            type: string
        stations:
          type: array
          items:
            $ref: "#/components/schemas/FireRegistryStation"
        stationsTruncated:
          type: boolean
        units:
          type: array
          items:
            $ref: "#/components/schemas/FireRegistryUnit"
        unitsTruncated:
          type: boolean
        jurisdictions:
          type: array
          items:
            $ref: "#/components/schemas/FireRegistryJurisdiction"
        jurisdictionsTruncated:
          type: boolean
      required:
        - source
        - sourceRecordId
        - sourceUrl
        - agencyName
        - stateCode
        - city
        - county
        - headquartersAddress
        - fdid
        - nerisId
        - departmentType
        - organizationType
        - entityType
        - stationCount
        - unitCount
        - exportDate
        - matchLevel
        - matchReasons
        - stations
        - stationsTruncated
        - units
        - unitsTruncated
        - jurisdictions
        - jurisdictionsTruncated
    FireRegistryMatchesResponse:
      type: object
      properties:
        fetchedAt:
          type: string
          format: date-time
        sourceStatuses:
          type: array
          items:
            $ref: "#/components/schemas/FireRegistrySourceStatus"
        records:
          type: array
          items:
            $ref: "#/components/schemas/FireRegistryCandidate"
      required: [fetchedAt, sourceStatuses, records]
    EmsRegistryAddress:
      type: object
      properties:
        purpose:
          type: ["string", "null"]
        line1:
          type: ["string", "null"]
        line2:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        stateCode:
          type: ["string", "null"]
        postalCode:
          type: ["string", "null"]
      required: [purpose, line1, line2, city, stateCode, postalCode]
    EmsRegistryTaxonomy:
      type: object
      properties:
        code:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        primary:
          type: boolean
        stateCode:
          type: ["string", "null"]
      required: [code, description, primary, stateCode]
    EmsRegistryCandidate:
      type: object
      properties:
        npi:
          type: string
        organizationName:
          type: string
        enumerationType:
          type: string
        updatedAt:
          type: ["string", "null"]
          format: date
        registryUrl:
          type: string
          format: uri
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/EmsRegistryAddress"
        taxonomies:
          type: array
          items:
            $ref: "#/components/schemas/EmsRegistryTaxonomy"
      required:
        - npi
        - organizationName
        - enumerationType
        - updatedAt
        - registryUrl
        - addresses
        - taxonomies
    EmsRegistryMatchesResponse:
      type: object
      properties:
        status:
          type: string
          enum: [available, unavailable]
        sourceUrl:
          type: string
          format: uri
        fetchedAt:
          type: string
          format: date-time
        searchScope:
          type: string
          enum: [name_city_state, name_state]
        recordCount:
          type: integer
        totalResults:
          type: integer
        resultsTruncated:
          type: boolean
        errorMessage:
          type: ["string", "null"]
        records:
          type: array
          items:
            $ref: "#/components/schemas/EmsRegistryCandidate"
      required:
        - status
        - sourceUrl
        - fetchedAt
        - searchScope
        - recordCount
        - totalResults
        - resultsTruncated
        - errorMessage
        - records
    TerritoryResearchMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required: [role, content]
    TerritoryResearchInput:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/TerritoryResearchMessage"
        agencyContext:
          type: object
          additionalProperties: true
        systemInstruction:
          type: string
      required: [messages]
    TerritoryResearchResponse:
      type: object
      properties:
        content:
          type: string
      required: [content]
    PlacesResearchInput:
      type: object
      properties:
        query:
          type: string
        city:
          type: string
        state:
          type: string
        latitude:
          type: number
        longitude:
          type: number
      required: [query]
    PlacesResearchResponse:
      type: object
      properties:
        text:
          type: string
        mapsLinks:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [text, mapsLinks]

