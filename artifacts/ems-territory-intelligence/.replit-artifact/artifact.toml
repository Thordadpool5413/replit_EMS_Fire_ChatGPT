kind = "web"
previewPath = "/"
title = "EMS & Fire Territory Intelligence"
description = "A field-sales and territory intelligence platform for EMS providers and fire departments, with agency management, healthcare insights, grant tracking, mapping, and mobile field workflows."
version = "1.0.0"
id = "artifacts/ems-territory-intelligence"
router = "path"

[[services]]
name = "web"
paths = [ "/", "/ems-territory-intelligence/" ]
localPort = 24938

[services.development]
run = "pnpm --filter @workspace/ems-territory-intelligence run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ems-territory-intelligence", "run", "build" ]
serve = "static"
publicDir = "artifacts/ems-territory-intelligence/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24938"
BASE_PATH = "/"
