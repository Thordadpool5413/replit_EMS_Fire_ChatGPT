name: Rebuild retained NERIS profiles
on:
  push:
    branches: [atlas/recover-neris-profiles]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mailing-source:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rebuild-neris-source]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check reconstructed source and exact first target batch
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/data/stage_neris_mailing_supplement.py scripts/data/retain_neris_mailing_source.py scripts/data/prepare_neris_independent_sites.py
          python3 scripts/data/retain_neris_primary.py --verify
          python3 scripts/data/prepare_neris_independent_sites.py --batch original-1251 --output "$RUNNER_TEMP/neris-original-1251.json" --report "$RUNNER_TEMP/neris-original-1251-report.json"
      - name: Acquire complete fixed public fields and bind original native records
        run: |
          set -euo pipefail
          python3 -u scripts/data/stage_neris_mailing_supplement.py --directory "$RUNNER_TEMP/neris-mailing-source"
          python3 scripts/data/retain_neris_mailing_source.py --directory "$RUNNER_TEMP/neris-mailing-source" --pin-edition
          python3 scripts/data/retain_neris_mailing_source.py --verify
      - name: Preserve frozen original target bytes
        run: |
          set -euo pipefail
          mkdir -p scripts/data/evidence/primary-neris-original-site-targets/2026-11-26
          cp "$RUNNER_TEMP/neris-original-1251.json" scripts/data/evidence/primary-neris-original-site-targets/2026-11-26/targets.json
          cp "$RUNNER_TEMP/neris-original-1251-report.json" scripts/data/evidence/primary-neris-original-site-targets/2026-11-26/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neris-native-source-review
          path: |
            scripts/data/evidence/neris-department-mailing
            scripts/data/evidence/primary-neris-original-site-targets
            scripts/fixtures/neris-mailing-source-edition.json
            ${{ runner.temp }}/neris-mailing-source/metadata-before.json
      - name: Save reviewed source evidence on an isolated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "atlas/neris-native-source-$GITHUB_RUN_ID"
          git add --force scripts/data/evidence/neris-department-mailing scripts/data/evidence/primary-neris-original-site-targets scripts/fixtures/neris-mailing-source-edition.json
          git diff --cached --quiet && exit 0
          git commit -m "Retain complete native NERIS supplemental source and frozen original site targets"
          git push origin HEAD
  mailing-identities:
    if: contains(github.event.head_commit.message, '[rebuild-neris-mailing]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce complete mailing identities and physical site targets
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/data/recover_neris_mailing_sites.py scripts/data/retain_neris_mailing_sites.py scripts/data/neris_profile_witnesses.py
          python3 scripts/data/retain_neris_mailing_source.py --verify
          python3 -u scripts/data/recover_neris_mailing_sites.py --output "$RUNNER_TEMP/neris-mailing-report.json" --targets "$RUNNER_TEMP/neris-mailing-targets.json"
          python3 -u scripts/data/retain_neris_mailing_sites.py --report "$RUNNER_TEMP/neris-mailing-report.json" --targets "$RUNNER_TEMP/neris-mailing-targets.json" --pin-targets
          python3 -u scripts/data/retain_neris_mailing_sites.py --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neris-mailing-identity-review
          path: |
            scripts/data/evidence/primary-neris-mailing-sites
            scripts/fixtures/neris-mailing-target-edition.json
            ${{ runner.temp }}/neris-mailing-report.json
            ${{ runner.temp }}/neris-mailing-targets.json
      - name: Save source bound identity scope on isolated review branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "atlas/neris-mailing-identities-$GITHUB_RUN_ID"
          git add --force scripts/data/evidence/primary-neris-mailing-sites scripts/fixtures/neris-mailing-target-edition.json
          git diff --cached --quiet && exit 0
          git commit -m "Retain replayed NERIS mailing identities and actual frozen physical site targets"
          git push origin HEAD
  owned-tests:
    if: contains(github.event.head_commit.message, '[test-neris-profiles]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate native identity, component and complete endpoint guards
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/data python3 -m unittest scripts/data/test_neris_primary_rebuilt.py scripts/data/test_neris_mailing_sites.py scripts/data/test_neris_geocoded_sites.py
  grid-points:
    if: contains(github.event.head_commit.message, '[rebuild-neris-grid]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test and replay complete native directional grid points
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/data python3 -m unittest scripts/data/test_neris_grid_points.py
          python3 -u scripts/data/retain_neris_grid_points.py
          python3 -u scripts/data/retain_neris_grid_points.py --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neris-grid-point-review
          path: scripts/data/evidence/primary-neris-grid-points
      - name: Save complete native grid point replay on isolated review branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "atlas/neris-grid-points-$GITHUB_RUN_ID"
          git add --force scripts/data/evidence/primary-neris-grid-points
          git diff --cached --quiet && exit 0
          git commit -m "Retain exact native directional grid address source points"
          git push origin HEAD
  usfa-native-source:
    if: contains(github.event.head_commit.message, '[rebuild-usfa-native]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Retain complete fixed national CSV and native identity reconciliation
        run: |
          set -euo pipefail
          python3 -u scripts/data/retain_usfa_native_source.py --download --pin-edition --directory "$RUNNER_TEMP/usfa-native"
          python3 -u scripts/data/retain_usfa_native_source.py --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usfa-native-source-review
          path: |
            scripts/data/evidence/usfa-native-national
            scripts/fixtures/usfa-native-source-edition.json
            ${{ runner.temp }}/usfa-native
      - name: Save complete native public source on isolated review branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "atlas/usfa-native-source-$GITHUB_RUN_ID"
          git add --force scripts/data/evidence/usfa-native-national scripts/fixtures/usfa-native-source-edition.json
          git diff --cached --quiet && exit 0
          git commit -m "Retain complete fixed public USFA native source and malformed row quarantine"
          git push origin HEAD
  retained-frontend-pins:
    if: contains(github.event.head_commit.message, '[rebuild-neris-pins]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build exact frontend and API bindings from full native replay
        run: |
          set -euo pipefail
          python3 -u scripts/data/build_neris_retained_profile_pins.py --profile mailing --profile grid --validation-output "$RUNNER_TEMP/neris-profile-frontend.json"
          npx --yes tsx --test artifacts/ems-territory-intelligence/src/services/nerisProofHash.test.ts
          npx --yes tsx scripts/data/check_neris_retained_frontend.ts "$RUNNER_TEMP/neris-profile-frontend.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neris-retained-frontend-bindings
          path: |
            artifacts/ems-territory-intelligence/src/services/neris*Pins.json
            artifacts/api-server/src/lib/nerisGrid*
            scripts/fixtures/neris-retained-*-examples.json
      - name: Save exact frontend proof bindings on isolated review branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "atlas/neris-retained-pins-$GITHUB_RUN_ID"
          git add artifacts/ems-territory-intelligence/src/services/neris*Pins.json artifacts/api-server/src/lib/nerisProofHash.ts artifacts/api-server/src/lib/nerisGridAddressContract.ts artifacts/api-server/src/lib/nerisGridPointPins.json scripts/fixtures/neris-retained-*-examples.json
          git diff --cached --quiet && exit 0
          git commit -m "Bind native NERIS mailing and grid frontend records to exact replayed evidence"
          git push origin HEAD
  website-sites:
    if: contains(github.event.head_commit.message, '[rebuild-neris-website]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete website identities and exact native site geometry
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/data python3 -m unittest scripts/data/test_neris_website_sites.py
          python3 -u scripts/data/retain_neris_website_sites.py
          python3 -u scripts/data/retain_neris_website_sites.py --verify
          python3 -u scripts/data/build_neris_retained_profile_pins.py --profile website --validation-output "$RUNNER_TEMP/neris-website-frontend.json"
          npx --yes tsx scripts/data/check_neris_retained_frontend.ts "$RUNNER_TEMP/neris-website-frontend.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neris-native-website-review
          path: |
            scripts/data/evidence/primary-neris-website-sites
            artifacts/ems-territory-intelligence/src/services/nerisWebsiteSitePins.json
            scripts/fixtures/neris-retained-website-examples.json
      - name: Save complete native website site evidence on isolated review branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "atlas/neris-website-sites-$GITHUB_RUN_ID"
          git add --force scripts/data/evidence/primary-neris-website-sites
          git add artifacts/ems-territory-intelligence/src/services/nerisWebsiteSitePins.json scripts/fixtures/neris-retained-website-examples.json
          git diff --cached --quiet && exit 0
          git commit -m "Retain complete reciprocal native website site identities and frontend proof bindings"
          git push origin HEAD
  original-geocoded-sites:
    if: contains(github.event.head_commit.message, '[rebuild-neris-core-geocodes]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild complete original NERIS independent-site source consensus
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/data python3 -m unittest scripts/data/test_neris_geocoded_sites.py
          python3 -u scripts/data/retain_neris_geocoded_sites.py --retained-sources
          python3 -u scripts/data/retain_neris_geocoded_sites.py --verify
          python3 -u scripts/data/build_neris_retained_profile_pins.py --profile core-geocoded --validation-output "$RUNNER_TEMP/neris-core-geocoded-frontend.json"
          npx --yes tsx scripts/data/check_neris_retained_frontend.ts "$RUNNER_TEMP/neris-core-geocoded-frontend.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neris-original-geocoded-sites-review
          path: |
            scripts/data/evidence/primary-neris-geocoded-sites
            artifacts/ems-territory-intelligence/src/services/nerisGeocodedSitePins.json
            scripts/fixtures/neris-retained-core-geocoded-examples.json
      - name: Save native identity and complete point consensus on review branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "atlas/neris-core-geocoded-sites-$GITHUB_RUN_ID"
          git add --force scripts/data/evidence/primary-neris-geocoded-sites
          git add artifacts/ems-territory-intelligence/src/services/nerisGeocodedSitePins.json scripts/fixtures/neris-retained-core-geocoded-examples.json
          git diff --cached --quiet && exit 0
          git commit -m "Retain original frozen NERIS site identities and complete independent point consensus"
          git push origin HEAD
  mailing-geocoded-sites:
    if: contains(github.event.head_commit.message, '[rebuild-neris-mail-geocodes]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Explain original retained geocode source decisions
        run: |
          set -euo pipefail
          python3 -u scripts/data/summarize_neris_geocoded_audit.py --evidence scripts/data/evidence/primary-neris-geocoded-sites/2026-11-26 --output scripts/data/evidence/primary-neris-geocoded-sites/2026-11-26/diagnostic-summary.json
      - name: Rebuild full five-source native mailing-site consensus
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/data python3 -m unittest scripts/data/test_neris_geocoded_sites.py scripts/data/test_neris_grid_points.py
          python3 -u scripts/data/retain_neris_mailing_geocoded_sites.py
          python3 -u scripts/data/retain_neris_mailing_geocoded_sites.py --verify
          python3 -u scripts/data/summarize_neris_geocoded_audit.py --evidence scripts/data/evidence/primary-neris-mailing-geocoded-sites/2026-11-26 --output scripts/data/evidence/primary-neris-mailing-geocoded-sites/2026-11-26/diagnostic-summary.json
          python3 -u scripts/data/build_neris_retained_profile_pins.py --profile mailing-geocoded --validation-output "$RUNNER_TEMP/neris-mailing-geocoded-frontend.json"
          npx --yes tsx scripts/data/check_neris_retained_frontend.ts "$RUNNER_TEMP/neris-mailing-geocoded-frontend.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neris-five-source-mailing-review
          path: |
            scripts/data/evidence/primary-neris-mailing-geocoded-sites
            scripts/data/evidence/primary-neris-geocoded-sites/2026-11-26/diagnostic-summary.json
            artifacts/ems-territory-intelligence/src/services/nerisMailingGeocodedSitePins.json
            scripts/fixtures/neris-retained-mailing-geocoded-examples.json
      - name: Save native mailing identities and five-source consensus
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "atlas/neris-mailing-geocoded-sites-$GITHUB_RUN_ID"
          git add --force scripts/data/evidence/primary-neris-mailing-geocoded-sites scripts/data/evidence/primary-neris-geocoded-sites/2026-11-26/diagnostic-summary.json
          git add artifacts/ems-territory-intelligence/src/services/nerisMailingGeocodedSitePins.json scripts/fixtures/neris-retained-mailing-geocoded-examples.json
          git diff --cached --quiet && exit 0
          git commit -m "Retain full five-source native mailing-site consensus and exact frontend bindings"
          git push origin HEAD
  native-negative-report-audit:
    if: contains(github.event.head_commit.message, '[audit-neris-negatives]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact native negative address bindings against production collector
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/data python3 -m unittest scripts/data/test_neris_release_reports.py
          git fetch --depth=1 origin 1e974f90c52c2126645fc464cb808086a48096b7
          git show FETCH_HEAD:scripts/data/build_primary_mapping_release.py > "$RUNNER_TEMP/production-primary-builder.py"
          python3 -u scripts/data/neris_release_reports.py --profile mailing --profile website --profile grid --profile core-geocoded --output-directory scripts/data/evidence/primary-neris-release-negative-adapters/2026-11-26
          python3 -u scripts/data/audit_neris_release_reports.py --builder-file "$RUNNER_TEMP/production-primary-builder.py" --profile mailing --profile website --profile grid --profile core-geocoded --output scripts/data/evidence/primary-neris-release-negative-adapters/2026-11-26/audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neris-native-negative-binding-audit
          path: scripts/data/evidence/primary-neris-release-negative-adapters
      - name: Save derived report audit without rewriting source archives
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "atlas/neris-native-negative-audit-$GITHUB_RUN_ID"
          git add --force scripts/data/evidence/primary-neris-release-negative-adapters
          git diff --cached --quiet && exit 0
          git commit -m "Audit replay-derived native negative report bindings against production source collector"
          git push origin HEAD
  native-range-sites:
    if: contains(github.event.head_commit.message, '[rebuild-neris-ranges]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install the native source shapefile reader
        run: python3 -m pip install pyshp==2.3.1
      - name: Rebuild both strict native range fallback profiles
        run: |
          set -euo pipefail
          PYTHONPATH=scripts/data python3 -m unittest scripts/data/test_neris_range_sites.py scripts/data/test_neris_release_reports.py
          python3 -u scripts/data/retain_neris_range_sites.py --family core
          python3 -u scripts/data/retain_neris_range_sites.py --family core --verify
          python3 -u scripts/data/retain_neris_range_sites.py --family mailing
          python3 -u scripts/data/retain_neris_range_sites.py --family mailing --verify
          python3 -u scripts/data/build_neris_retained_profile_pins.py --profile range --profile mailing-range --validation-output "$RUNNER_TEMP/neris-range-frontend.json"
          npx --yes tsx scripts/data/check_neris_retained_frontend.ts "$RUNNER_TEMP/neris-range-frontend.json"
          npx --yes tsx --test artifacts/ems-territory-intelligence/src/services/nerisGeocodedSiteContract.test.ts
      - name: Audit all seven complete profile negative reports
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 712b04527baddd469880d6be9b2ecafe7a02aab4
          git show FETCH_HEAD:scripts/data/build_primary_mapping_release.py > "$RUNNER_TEMP/production-primary-builder.py"
          python3 -u scripts/data/neris_release_reports.py --profile mailing --profile website --profile grid --profile core-geocoded --profile mailing-geocoded --profile range --profile mailing-range --output-directory scripts/data/evidence/primary-neris-release-negative-adapters/2026-11-26
          python3 -u scripts/data/audit_neris_release_reports.py --builder-file "$RUNNER_TEMP/production-primary-builder.py" --profile mailing --profile website --profile grid --profile core-geocoded --profile mailing-geocoded --profile range --profile mailing-range --output scripts/data/evidence/primary-neris-release-negative-adapters/2026-11-26/audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neris-native-range-sites-review
          path: |
            scripts/data/evidence/primary-neris-range-sites
            scripts/data/evidence/primary-neris-mailing-range-sites
            scripts/data/evidence/primary-neris-release-negative-adapters
            artifacts/ems-territory-intelligence/src/services/nerisRangeSitePins.json
            artifacts/ems-territory-intelligence/src/services/nerisMailingRangeSitePins.json
            scripts/fixtures/neris-retained-range-examples.json
            scripts/fixtures/neris-retained-mailing-range-examples.json
      - name: Save native range fallback evidence and report adapters
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "atlas/neris-native-range-sites-$GITHUB_RUN_ID"
          git add --force scripts/data/evidence/primary-neris-range-sites scripts/data/evidence/primary-neris-mailing-range-sites scripts/data/evidence/primary-neris-release-negative-adapters
          git add artifacts/ems-territory-intelligence/src/services/nerisRangeSitePins.json artifacts/ems-territory-intelligence/src/services/nerisMailingRangeSitePins.json scripts/fixtures/neris-retained-range-examples.json scripts/fixtures/neris-retained-mailing-range-examples.json
          git diff --cached --quiet && exit 0
          git commit -m "Retain truthfully labeled native range site proofs and complete negative binding audit"
          git push origin HEAD
