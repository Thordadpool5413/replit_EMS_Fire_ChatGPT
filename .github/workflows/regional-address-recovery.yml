name: Regional government address point recovery
on:
  push:
    branches: [main, atlas/regional-address-recovery, atlas/regional-address-recovery-v2, atlas/regional-address-recovery-v3, atlas/regional-address-recovery-v4, atlas/regional-address-recovery-v5, atlas/regional-address-recovery-v6, atlas/regional-address-recovery-v7]
    paths:
      - 'scripts/data/recover_regional_locations.py'
      - 'scripts/data/regional_point_contract.py'
      - 'scripts/data/test_recover_regional_locations.py'
      - '.github/workflows/regional-address-recovery.yml'
      - 'scripts/data/check_additive_location_release.py'
      - 'artifacts/ems-territory-intelligence/public/registry/locations/**'
  pull_request:
    paths:
      - 'scripts/data/recover_regional_locations.py'
      - 'scripts/data/regional_point_contract.py'
      - 'scripts/data/test_recover_regional_locations.py'
      - '.github/workflows/regional-address-recovery.yml'
      - 'scripts/data/check_additive_location_release.py'
      - 'artifacts/ems-territory-intelligence/public/registry/locations/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && format('atlas-regional-validation-{0}', github.ref) || 'atlas-regional-recovery' }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python data tests
        uses: ./.github/actions/setup-data-tests
      - name: Verify regional matching and release gates
        run: python3 -m unittest discover -s scripts/data -p 'test_*.py'
      - name: Verify checked-in provider location snapshot
        run: python3 scripts/data/backfill_provider_locations.py --verify
      - name: Validate additive provider location changes against PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          snapshot=artifacts/ems-territory-intelligence/public/registry/locations
          if git diff --quiet "$BASE_SHA" HEAD -- "$snapshot"; then
            echo 'No provider location changes in this pull request.'
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/atlas-location-base"
          git archive "$BASE_SHA" "$snapshot" | tar -x -C "$RUNNER_TEMP/atlas-location-base"
          python3 scripts/data/check_additive_location_release.py --base "$RUNNER_TEMP/atlas-location-base/$snapshot" --candidate "$snapshot"
  recover:
    if: github.ref == 'refs/heads/atlas/regional-address-recovery' || github.ref == 'refs/heads/atlas/regional-address-recovery-v2' || github.ref == 'refs/heads/atlas/regional-address-recovery-v3' || github.ref == 'refs/heads/atlas/regional-address-recovery-v4' || github.ref == 'refs/heads/atlas/regional-address-recovery-v5' || github.ref == 'refs/heads/atlas/regional-address-recovery-v6' || github.ref == 'refs/heads/atlas/regional-address-recovery-v7'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python data tests
        uses: ./.github/actions/setup-data-tests
      - name: Validate regional source contract and matching rules
        run: python3 -m unittest discover -s scripts/data -p 'test_*.py'
      - name: Preserve verified base snapshot for additive release gate
        run: cp -a artifacts/ems-territory-intelligence/public/registry/locations "$RUNNER_TEMP/base-locations"
      - name: Query official address points for unresolved provider streets
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "atlas/regional-address-recovery-v7" ]; then
            python3 scripts/data/recover_regional_locations.py --source ga-fulton --max-requests 120 --allow-empty
          elif [ "$GITHUB_REF_NAME" = "atlas/regional-address-recovery-v6" ]; then
            python3 scripts/data/recover_regional_locations.py --source in-data-harvest --max-requests 120 --allow-empty
          elif [ "$GITHUB_REF_NAME" = "atlas/regional-address-recovery-v5" ]; then
            python3 scripts/data/recover_regional_locations.py --source il-peoria --source il-lake --source pa-northampton --source al-baldwin --max-requests 100 --allow-empty
          elif [ "$GITHUB_REF_NAME" = "atlas/regional-address-recovery-v4" ]; then
            python3 scripts/data/recover_regional_locations.py --source tx-stratmap --max-requests 120 --allow-empty
          elif [ "$GITHUB_REF_NAME" = "atlas/regional-address-recovery-v3" ]; then
            python3 scripts/data/recover_regional_locations.py --source tx-prosper --source pa-cumberland --max-requests 100 --allow-empty
          elif [ "$GITHUB_REF_NAME" = "atlas/regional-address-recovery-v2" ]; then
            python3 scripts/data/recover_regional_locations.py --source nj-addresspoints --max-requests 100 --allow-empty
          else
            python3 scripts/data/recover_regional_locations.py --max-requests 100
          fi
      - name: Publish review-only candidate
        run: |
          set -euo pipefail
          python3 scripts/data/backfill_provider_locations.py --verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- artifacts/ems-territory-intelligence/public/registry/locations
          if git diff --cached --quiet; then
            echo 'No new validated address points; no candidate branch published.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/data/check_additive_location_release.py --base "$RUNNER_TEMP/base-locations" --candidate artifacts/ems-territory-intelligence/public/registry/locations
          git commit -m "Recover exact regional official address points"
          git push origin "HEAD:refs/heads/atlas/regional-location-data-${GITHUB_RUN_ID}"
          echo "Review branch: atlas/regional-location-data-${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json; x=json.load(open("artifacts/ems-territory-intelligence/public/registry/locations/index.json")); print(json.dumps(x["regionalRecovery"],indent=2))' >> "$GITHUB_STEP_SUMMARY"
