name: National address point recovery
on:
  push:
    branches: [atlas/national-address-point-recovery]
    paths:
      - 'scripts/data/recover_ny_locations.py'
      - 'scripts/data/recover_nad_bulk_locations.py'
      - '.github/workflows/national-address-point-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-national-point-recovery
  cancel-in-progress: false
jobs:
  ny:
    if: github.ref == 'refs/heads/atlas/national-address-point-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: python3 -m unittest discover -s scripts/data -p 'test_*.py'
      - name: Recover New York official SAM points
        run: python3 scripts/data/recover_ny_locations.py
      - name: Publish reviewed-data candidate only
        run: |
          set -euo pipefail
          python3 scripts/data/backfill_provider_locations.py --verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- artifacts/ems-territory-intelligence/public/registry/locations
          git commit -m "Recover exact NYS SAM points for public registry addresses"
          branch="atlas/ny-location-data-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"
          echo "Data review branch: $branch" >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json; x=json.load(open("artifacts/ems-territory-intelligence/public/registry/locations/index.json")); print(json.dumps(x["nySamRecovery"],indent=2))' >> "$GITHUB_STEP_SUMMARY"
  nad:
    if: github.ref == 'refs/heads/atlas/national-address-point-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - run: python3 -m unittest discover -s scripts/data -p 'test_*.py'
      - name: Download pinned USDOT public release r24
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nad-r24.zip"
          free=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -1 | tr -d ' ')
          limit=$(( free - 2000000000 ))
          test "$limit" -gt 1000000000
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 30 --max-time 3600 --max-filesize "$limit" --retry 1 --output "$archive" 'https://data.transportation.gov/api/views/fc2s-wawr/files/596a301b-d548-4589-8c63-6b6a8dc34f30?download=true&filename=TXT.zip'
          python3 -m zipfile -l "$archive"
      - name: Stream national public address points
        run: python3 scripts/data/recover_nad_bulk_locations.py --archive "$RUNNER_TEMP/nad-r24.zip"
      - name: Publish reviewed-data candidate only
        run: |
          set -euo pipefail
          python3 scripts/data/backfill_provider_locations.py --verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- artifacts/ems-territory-intelligence/public/registry/locations
          git commit -m "Recover exact public registry coordinates from pinned NAD release r24"
          branch="atlas/nad-bulk-location-data-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$branch"
          echo "Data review branch: $branch" >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json; x=json.load(open("artifacts/ems-territory-intelligence/public/registry/locations/index.json")); print(json.dumps(x["nadBulkRecovery"],indent=2))' >> "$GITHUB_STEP_SUMMARY"
